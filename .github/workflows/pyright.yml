name: Pyright

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  basedpyright:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .[dev]

      - name: Run basedpyright
        run: basedpyright .